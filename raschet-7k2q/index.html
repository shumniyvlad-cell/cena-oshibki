<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цена ошибки — полный расчёт</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F2EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FFD21F' stroke='%230E0E0F' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230E0E0F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sheet.css">
<link rel="stylesheet" href="../css/app.css">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('motion') === '1') localStorage.setItem('kt-motion', '1');
    var forced = localStorage.getItem('kt-motion') === '1';
    if (forced || !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
  })();
</script>
</head>
<body class="app">
<header class="app-top no-print">
  <div class="app-wrap">
    <a class="logo" href="../" aria-label="Цена ошибки, на главную"><span class="mark"></span>Цена ошибки</a>
    <div class="app-prog" id="prog" aria-hidden="true"></div>
  </div>
</header>
<main class="app-wrap" id="app" tabindex="-1"></main>
<noscript><p class="app-wrap">Для расчёта нужен включённый JavaScript.</p></noscript>
<script src="../js/config.js"></script>
<script src="../js/method.js"></script>
<script src="../js/render.js"></script>
<script src="../js/protocol.js"></script>
</body>
</html>
